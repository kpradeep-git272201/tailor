<ion-toolbar class="toolbar">
  <ion-header class="custom-header">
    <ion-buttons>
      <ion-back-button
        defaultHref="/main/dashboard/with-fabric"
      ></ion-back-button>
      <ion-title *ngIf="article">{{article.articleName}}</ion-title>
    </ion-buttons>

    <div class="search-bar-row">
      <ion-searchbar
        [placeholder]="searchQueryAuto"
        class="custom-searchbar"
        searchIcon="search-outline"
        mode="md"
        showCancelButton="never"
        animated="true"
        slot="end"
      ></ion-searchbar>

      <div class="icon-row">
        <ion-icon name="notifications-outline"></ion-icon>
        <ion-icon name="heart-outline"></ion-icon>
        <ion-icon name="person-outline"></ion-icon>
      </div>
    </div>
  </ion-header>
</ion-toolbar>
<ion-content
  [fullscreen]="true"
  (ionScroll)="onScroll($event)"
  scrollEvents="true"
>
  <div class="category-list">
    <div
      class="category-item"
      *ngFor="let fabCat of fabricCategory"
      [ngClass]="{ 'selected': fabCat.selected }"
      (click)="toggleSelection(fabCat)"
    >
      <ion-thumbnail class="articles checked">
        <img [src]="fabCat.fabricCategoryImagePath" [alt]="fabCat.fabricCategoryName" />
        <ion-icon
          *ngIf="fabCat.selected"
          name="checkmark-circle"
          class="check-icon"
        ></ion-icon>
      </ion-thumbnail>
      <p class="thumbnail-text">{{ fabCat.fabricCategoryName }}</p>
    </div>
  </div>

  <div *ngIf="articlesCategories">
    <ngb-carousel
      #carousel
      [interval]="2000"
      [pauseOnFocus]="true"
      (slide)="onSlide($event)"
      [showNavigationArrows]="true"
      [showNavigationIndicators]="false"
      class="carousel-container custom-carousel"
    >
      <ng-template ngbSlide *ngIf="article">
        <div class="carousel-slide">
         
          <a>
            <div class="picsum-img-wrapper">
              <img
                [src]="'assets/images/offer/Seasonal_disc.png'"
                [alt]="article.articleName"
                height="245px"
                width="455px"
              />
            </div>
          </a>
        </div>
      </ng-template>
    </ngb-carousel>
  </div>

  <div class="top-rated" style="padding-bottom: 20px">
    <h3 class="section-title fs-subtitle">Fabric By Article</h3>
    <ion-grid
      class="fabric-grid"
      *ngIf="articlesCategories.length"
      style="padding: 0rem"
    >
      <ion-row>
        <ion-col
          size="6"
          size-md="4"
          size-lg="3"
          *ngFor="let fabric of articlesCategories; let i = index;"
        >
          <ion-card class="fabric-card" (click)="selectedFabric(fabric)">
            <img [src]="fabric.imagePath" class="fabric-img" [alt]="fabric.fabricName" />
            <ion-card-header>
              <ion-card-title class="font-16">
                <span style="font-size: 0.75rem; font-weight: 600"
                  >{{ fabric.categoryName }}</span
                >
                <br />
                <span style="font-size: 0.75rem">{{fabric.fabricName}}</span>
                <br />
                <span style="font-size: 0.75rem"
                  >&#8377;{{ fabric?.pricePerMeter }}</span
                >
              </ion-card-title>
            </ion-card-header>
          </ion-card>
        </ion-col>
      </ion-row>

    </ion-grid>
  </div>
</ion-content>
